  <div class="absolute inset-0 bg-slate-950/65 backdrop-blur-sm" data-tt-cp-close></div>

  <div class="relative mx-auto mt-[10vh] w-[94vw] max-w-2xl">
    <div class="overflow-hidden rounded-3xl border border-slate-200 bg-white text-slate-900 shadow-2xl dark:border-slate-700 dark:bg-slate-900 dark:text-white">
      <div class="flex items-center justify-between border-b border-slate-100 px-5 py-3 dark:border-slate-800">
        <div><p class="text-xs font-semibold uppercase tracking-widest text-primary">EvilTime</p><p class="text-sm font-semibold">{{ _('Command panel') }}</p></div>
        <button id="ttCommandPaletteClose" type="button" class="rounded-xl px-2.5 py-1.5 text-sm text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">{{ _('Close') }}</button>
      </div>

      <div class="p-3">
        <div class="flex items-center gap-2 rounded-2xl bg-slate-100 px-3 dark:bg-slate-800">
          <i class="fas fa-magnifying-glass text-slate-400"></i>
          <input
            id="ttCommandPaletteInput"
            type="text"
            class="w-full border-0 bg-transparent py-3 text-base outline-none placeholder:text-slate-400 focus:ring-0"
            placeholder="{{ _('Type a command or search...') }}"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
          >
        </div>

        <div class="mt-3">
          <div id="ttCommandPaletteSubheader" class="mb-2 px-3 text-xs font-semibold uppercase tracking-wider text-primary hidden"></div>
          <div id="ttCommandPaletteList" class="flex max-h-[26rem] flex-col gap-1 overflow-y-auto py-1"></div>
        </div>
      </div>
      <footer class="flex items-center justify-between border-t border-slate-100 px-5 py-2.5 text-[11px] text-slate-400 dark:border-slate-800"><span><kbd class="rounded border px-1.5 py-0.5">↑↓</kbd> {{ _('Navigate') }} <kbd class="ml-2 rounded border px-1.5 py-0.5">Enter</kbd> {{ _('Run') }}</span><span><kbd class="rounded border px-1.5 py-0.5">Esc</kbd> {{ _('Back / close') }}</span></footer>
    </div>
  </div>
</div>
